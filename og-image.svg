<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Soft Emerald Ambient Glows -->
  <circle cx="150" cy="120" r="280" fill="#10b981" fill-opacity="0.18" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="320" fill="#059669" fill-opacity="0.22" filter="url(#glow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Mark Icon (Left) -->
  <g transform="translate(100, 115)">
    <rect width="120" height="120" rx="32" fill="url(#emeraldGrad)" />
    <!-- Refrigerator Silhouette -->
    <rect x="36" y="24" width="48" height="72" rx="10" fill="#ffffff" />
    <line x1="36" y1="52" x2="84" y2="52" stroke="#059669" stroke-width="3" />
    <rect x="42" y="32" width="4" height="12" rx="2" fill="#047857" />
    <rect x="42" y="60" width="4" height="18" rx="2" fill="#047857" />
    <!-- Leaf Accent -->
    <path d="M68 44C82 32 92 36 92 36C92 36 94 46 82 58C70 70 68 44 68 44Z" fill="#a7f3d0" />
  </g>

  <!-- App Header Text -->
  <text x="245" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">FoodKeeper</text>
  <rect x="495" y="142" width="130" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="560" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">SMART PWA</text>

  <!-- Big Catchy Headline -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Умный трекер питания,
  </text>
  <text x="100" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#emeraldGrad)" letter-spacing="-1.5">
    холодильник и рацион на неделю
  </text>

  <!-- Tagline / Subtitle -->
  <text x="100" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Контроль сроков годности • 1000 проверенных рецептов • Zero-Waste спасение еды • Расчет КБЖУ
  </text>

  <!-- Feature Pill Badges (Bottom) -->
  <g transform="translate(100, 475)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="110" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">❄️ Сроки годности</text>

    <!-- Pill 2 -->
    <rect x="236" y="0" width="230" height="48" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="351" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">📅 Рацион на 7 дней</text>

    <!-- Pill 3 -->
    <rect x="482" y="0" width="230" height="48" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="597" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">🛒 Список покупок</text>

    <!-- Pill 4 -->
    <rect x="728" y="0" width="240" height="48" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <text x="848" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">⚡ 100% Офлайн PWA</text>
  </g>
</svg>
